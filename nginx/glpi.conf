server {

  listen 80;
  server_name _;

  # Interceptar 401/403 del auth_request y mandar al login
  resolver 127.0.0.11 ipv6=off valid=30s;
  error_page 401 = @oauth2_signin;
  error_page 403 = @oauth2_signin;

  location @oauth2_signin {
    return 302 /oauth2/start?rd=$scheme://$host$request_uri;
  }

  location = /logout {
    return 302 /oauth2/sign_out?rd=/oauth2/end_session;
  }

  # 2) Punto intermedio: una vez que oauth2-proxy borra su cookie,
  #    lo mandamos a cerrar sesión en Keycloak (end_session)
  location = /oauth2/end_session {
    # post_logout_redirect_uri es a donde volverá Keycloak tras cerrar sesión
    return 302 http://localhost:8081/realms/glpi/protocol/openid-connect/logout?post_logout_redirect_uri=http://$host/&client_id=glpi-proxy;
  }

  location = /front/logout.php {
    return 302 /logout;
  }

  # (opcional) healthcheck de logout
  location = /logoutz { return 200; }

  # Subrequest de autenticación (clave el header extra)
  location = /oauth2/auth {
    proxy_pass               http://oauth2-proxy:4180;
    proxy_pass_request_body  off;
    proxy_set_header Content-Length "";
    proxy_set_header Host                 $host;
    proxy_set_header X-Real-IP            $remote_addr;
    proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host     $host;
    proxy_set_header X-Forwarded-Proto    $scheme;
    proxy_set_header X-Original-URI       $request_uri;
    proxy_set_header X-Auth-Request-Redirect $request_uri;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_buffering off;
  }

  # Rutas públicas del proxy (login/logout/callback)
  location /oauth2/ {
    proxy_pass http://oauth2-proxy:4180;
      proxy_set_header Host                 $host;
      proxy_set_header X-Real-IP            $remote_addr;
      proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host     $host;
      proxy_set_header X-Forwarded-Proto    $scheme;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_buffering off;
  }

  # Tu upstream protegido
  location / {
    auth_request /oauth2/auth;

    # Capturar headers del subrequest de forma “oficial”
    auth_request_set $user  $upstream_http_x_auth_request_user;
    auth_request_set $email $upstream_http_x_auth_request_email;

    proxy_set_header REMOTE_USER            $user;
    proxy_set_header HTTP_REMOTE_USER       $user;
    proxy_set_header HTTP_AUTH_USER         $user;
    proxy_set_header HTTP_AUTH_EMAIL        $email;

    proxy_set_header X-Forwarded-User       $user;
    proxy_set_header X-Forwarded-Email      $email;

    proxy_set_header Host                   $host;
    proxy_set_header X-Real-IP              $remote_addr;
    proxy_set_header X-Forwarded-For        $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host       $host;
    proxy_set_header X-Forwarded-Proto      $scheme;

    proxy_read_timeout 300;
    proxy_pass http://glpi:80;
  }

  location = /oauth2/healthz {
    proxy_pass http://oauth2-proxy:4180/ping;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
  }

    # evita de nuevo el 502 por Set-Cookie gordo
  proxy_buffer_size        64k;
  proxy_buffers            8 64k;
  proxy_busy_buffers_size  128k;

  proxy_connect_timeout    5s;
  proxy_read_timeout       30s;

}