# Nginx Ingress Controller Configuration for GLPI SSO
# Use this file if you want to deploy nginx-ingress as part of this chart

controller:
  # Configuración del controlador
  config:
    # Configuración para autenticación OAuth2
    auth-url: "http://oauth2-proxy.default.svc.cluster.local/oauth2/auth"
    auth-signin: "http://$host/oauth2/start?rd=$escaped_request_uri"
    auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email"
    
    # Configuración de proxy
    proxy-buffer-size: "64k"
    proxy-buffers: "8 64k"
    proxy-busy-buffers-size: "128k"
    proxy-connect-timeout: "5s"
    proxy-read-timeout: "30s"
    
    # Configuración de SSL
    ssl-redirect: "false"  # Set to true for production with TLS
    force-ssl-redirect: "false"
    
    # Configuración de rate limiting
    rate-limit: "100"
    rate-limit-window: "1m"
    
    # Configuración de logging
    log-format-escape-json: "true"
    log-format-upstream: '{"time": "$time_iso8601", "remote_addr": "$proxy_protocol_addr", "x-forward-for": "$proxy_add_x_forwarded_for", "request_id": "$req_id", "remote_user": "$remote_user", "bytes_sent": $bytes_sent, "request_time": $request_time, "status": $status, "vhost": "$host", "request_proto": "$server_protocol", "path": "$uri", "request_query": "$args", "request_length": $request_length, "duration": $request_time,"method": "$request_method", "http_referrer": "$http_referer", "http_user_agent": "$http_user_agent" }'
  
  # Configuración del servicio
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
  
  # Configuración de recursos
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  
  # Configuración de replicas
  replicaCount: 2
  
  # Configuración de tolerations para nodos específicos
  tolerations:
    - key: "node-role.kubernetes.io/ingress"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  
  # Configuración de nodeSelector para nodos específicos
  nodeSelector:
    node-role.kubernetes.io/ingress: "true"
  
  # Configuración de affinity para alta disponibilidad
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - nginx-ingress
            topologyKey: kubernetes.io/hostname

# Configuración del admission webhook
admissionWebhooks:
  enabled: true
  patch:
    enabled: true
    image:
      repository: registry.k8s.io/ingress-nginx/kube-webhook-certgen
      tag: "v20231011-8b53cabe0"
  
  # Configuración de recursos para el webhook
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Configuración de métricas
metrics:
  enabled: true
  service:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "10254"
  
  # Configuración de recursos para métricas
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Configuración de RBAC
rbac:
  create: true

# Configuración de service account
serviceAccount:
  create: true
  name: "nginx-ingress"

# Configuración de pod security policy
podSecurityPolicy:
  enabled: false

# Configuración de network policy
networkPolicy:
  enabled: false

# Configuración de pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Configuración de horizontal pod autoscaler
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
