{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "glpi-sso.fullname" . }}-keycloak
  labels:
    {{- include "glpi-sso.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  type: {{ .Values.keycloak.service.type }}
  ports:
    - port: {{ .Values.keycloak.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    {{- include "glpi-sso.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
{{- end }}
