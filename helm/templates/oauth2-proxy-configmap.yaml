{{- if .Values.oauth2-proxy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "glpi-sso.fullname" . }}-oauth2-proxy-config
  labels:
    {{- include "glpi-sso.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth2-proxy
data:
  oauth2-proxy.conf: |
    ## OAuth2 Proxy Configuration
    ## Generated by Helm template
    
    # Client configuration
    client_id = "{{ .Values.oauth2-proxy.config.clientID }}"
    client_secret = "{{ .Values.oauth2-proxy.config.clientSecret }}"
    cookie_secret = "{{ .Values.oauth2-proxy.config.cookieSecret }}"
    
    # Server configuration
    http_address = "0.0.0.0:4180"
    
    # Provider configuration
    provider = "oidc"
    oidc_issuer_url = "http://{{ include "glpi-sso.fullname" . }}-keycloak:{{ .Values.keycloak.service.port }}/realms/glpi"
    skip_oidc_discovery = true
    oidc_jwks_url = "http://{{ include "glpi-sso.fullname" . }}-keycloak:{{ .Values.keycloak.service.port }}/realms/glpi/protocol/openid-connect/certs"
    redeem_url = "http://{{ include "glpi-sso.fullname" . }}-keycloak:{{ .Values.keycloak.service.port }}/realms/glpi/protocol/openid-connect/token"
    profile_url = "http://{{ include "glpi-sso.fullname" . }}-keycloak:{{ .Values.keycloak.service.port }}/realms/glpi/protocol/openid-connect/userinfo"
    
    # Cookie configuration
    cookie_secure = false
    cookie_samesite = "lax"
    cookie_name = "_glpi_oauth2"
    
    # Authentication configuration
    email_domains = [ "*" ]
    scope = "openid profile email"
    pass_user_headers = true
    set_xauthrequest = true
    skip_provider_button = true
    reverse_proxy = true
    pass_id_token = false
    
    # Routes configuration
    skip_auth_routes = "/front/helpdesk.public.php,/front/login.php"
    upstreams = [ "http://{{ include "glpi-sso.fullname" . }}-glpi:{{ .Values.glpi.service.port }}" ]
    
    # Redirect configuration
    redirect_url = "http://{{ .Values.global.domain }}/oauth2/callback"
    login_url = "http://{{ include "glpi-sso.fullname" . }}-keycloak:{{ .Values.keycloak.service.port }}/realms/glpi/protocol/openid-connect/auth"
    
    # Logging
    request_logging = true
    auth_logging = true
    standard_logging = true
{{- end }}
