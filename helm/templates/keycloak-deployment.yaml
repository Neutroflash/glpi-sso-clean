{{- if .Values.keycloak.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "glpi-sso.fullname" . }}-keycloak
  labels:
    {{- include "glpi-sso.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "glpi-sso.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: keycloak
  template:
    metadata:
      labels:
        {{- include "glpi-sso.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak
    spec:
      containers:
        - name: keycloak
          image: "quay.io/keycloak/keycloak:26.3.2"
          args:
            - "start-dev"
            - "--http-port=8080"
            - "--import-realm"
          env:
            - name: KEYCLOAK_ADMIN
              value: {{ .Values.keycloak.auth.adminUser | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: {{ .Values.keycloak.auth.adminPassword | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          volumeMounts:
            - name: keycloak-data
              mountPath: /opt/keycloak/data
            - name: realm-config
              mountPath: /opt/keycloak/data/import
          livenessProbe:
            httpGet:
              path: /realms/master/.well-known/openid-configuration
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /realms/master/.well-known/openid-configuration
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: keycloak-data
          {{- if .Values.keycloak.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "glpi-sso.fullname" . }}-keycloak
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: realm-config
          configMap:
            name: {{ include "glpi-sso.fullname" . }}-keycloak-realm
{{- end }}
