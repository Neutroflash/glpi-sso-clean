apiVersion: v2
name: glpi-sso
description: A Helm chart for GLPI with SSO authentication using Keycloak and OAuth2-Proxy
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - glpi
  - sso
  - keycloak
  - oauth2-proxy
home: https://github.com/your-repo/glpi-sso-clean
sources:
  - https://github.com/glpi-project/glpi
  - https://github.com/keycloak/keycloak
  - https://github.com/oauth2-proxy/oauth2-proxy
maintainers:
  - name: Your Name
    email: your.email@example.com
dependencies:
  - name: mysql
    version: 9.14.2
    repository: https://charts.bitnami.com/bitnami
    condition: mysql.enabled
  - name: keycloak
    version: 7.0.0
    repository: https://charts.bitnami.com/bitnami
    condition: keycloak.enabled
  - name: oauth2-proxy
    version: 6.35.0
    repository: https://oauth2-proxy.github.io/manifests
    condition: oauth2-proxy.enabled
