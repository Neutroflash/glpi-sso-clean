  # Development configuration for GLPI SSO
  global:
    environment: development
    domain: localhost

  # GLPI Configuration
  glpi:
    enabled: true
    image:
      repository: glpi-local
      tag: "10.0.19"
      pullPolicy: IfNotPresent

    replicaCount: 1

    ingress:
      enabled: true
      className: nginx
      annotations:
        nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.default.svc.cluster.local/oauth2/auth"
        nginx.ingress.kubernetes.io/auth-signin: "http://$host/oauth2/start?rd=$escaped_request_uri"
        nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email"
      hosts:
        - host: glpi.localhost
          paths:
            - path: /
              pathType: Prefix
      tls: []

    persistence:
      enabled: true
      storageClass: ""
      accessMode: ReadWriteOnce
      size: 5Gi

    env:
      GLPI_SKIP_AUTOINSTALL: "true"
      GLPI_INSTALL_AUTO: "0"
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: "glpi"
      MYSQL_USER: "glpi"
      MYSQL_PASSWORD: "glpi_password"

    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi

  # MySQL Configuration
  mysql:
    enabled: true
    auth:
      rootPassword: "root_password"
      database: "glpi"
      username: "glpi"
      password: "glpi_password"

    primary:
      persistence:
        enabled: true
        storageClass: ""
        size: 5Gi

      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 250m
          memory: 256Mi

  # Keycloak Configuration
  keycloak:
    enabled: true
    networkPolicy:
      enabled: false
    # Para entorno dev: sin TLS estricto ni reverse proxy complicado
    production: false
    proxy: "edge"
    httpRelativePath: "/"

    # <<< ACTIVA EL POSTGRESQL INTERNO DEL CHART >>>
    postgresql:
      enabled: true
      auth:
        postgresPassword: "postgres_password_dev"   # cambia a algo propio
        username: "bn_keycloak"
        password: "keycloak_db_password_dev"        # cambia a algo propio
        database: "bitnami_keycloak"

    # Asegura el puerto http que usas en tus plantillas
    service:
      type: ClusterIP
      ports:
        http: 80
        https: 443
      http:
        enabled: true
      https:
        enabled: false

    auth:
      adminUser: admin
      adminPassword: "admin_password"

    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: keycloak.localhost
          paths:
            - path: /
              pathType: Prefix
      tls: []

    persistence:
      enabled: true
      storageClass: ""
      size: 5Gi

    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi

  # OAuth2-Proxy Configuration
  oauth2-proxy:
    enabled: true

    image:
      repository: quay.io/oauth2-proxy/oauth2-proxy
      tag: "v7.11.0"

    service:
      type: ClusterIP
      portNumber: 4180

    extraArgs:
      provider: oidc
      oidc-issuer-url: "http://glpi-keycloak.glpi.svc.cluster.local/realms/glpi"
      # cookies para entorno local
      cookie-secure: "false"
      cookie-samesite: "lax"
      cookie-domain: "glpi.localhost"
      email-domain: "*"
      reverse-proxy: "true"
      set-xauthrequest: "true"
      skip-provider-button: "true"
      redirect-url: "http://glpi.localhost/oauth2/callback"

    ingress:
      enabled: false
      className: nginx
      hosts:
        - glpi.localhost
      path: /oauth2
      pathType: Prefix

    resources:
      requests:
        cpu: 125m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
