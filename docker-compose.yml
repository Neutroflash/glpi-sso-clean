services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [glpi_net]

  glpi:
    platform: linux/amd64
    image: glpi/glpi:10.0.19
    env_file:
      - .env
    environment:
      GLPI_SKIP_AUTOINSTALL: "true"
      GLPI_INSTALL_AUTO: "0"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - glpi_data:/var/www/html/glpi
    ports:
      - "8085:80"
    networks: [glpi_net]

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command: [ "start-dev", "--http-port=8080" ]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
      - "8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data           # <— persistir realm
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e \"GET /realms/master/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q '200 OK' <&3" ]
      retries: 20
    networks: [ glpi_net ]

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.11.0
    platform: "linux/amd64"     # si usas Apple Silicon
    depends_on:
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOG_LEVEL: "debug"
      OAUTH2_PROXY_SHOW_DEBUG_ON_ERROR: "true"
      OAUTH2_PROXY_COOKIE_SECRET: "GOG97zh0RM5XN8mS2EMCQ6bQadARKGD8"
      OAUTH2_PROXY_SIGNOUT_URL: "/oauth2/sign_out"
      OAUTH2_PROXY_PROVIDER: "oidc"
      OAUTH2_PROXY_OIDC_ISSUER_URL: "http://localhost:8081/realms/glpi"
      OAUTH2_PROXY_CLIENT_ID: "${OAUTH2_PROXY_CLIENT_ID}"
      OAUTH2_PROXY_COOKIE_NAME: "_glpi_oauth2"
      OAUTH2_PROXY_CLIENT_SECRET: "${OAUTH2_PROXY_CLIENT_SECRET}"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_REDIRECT_URL: "http://localhost/oauth2/callback"
      # Navegador → Keycloak público
      OAUTH2_PROXY_LOGIN_URL: "http://localhost:8081/realms/glpi/protocol/openid-connect/auth"
      # Proxy → Keycloak interno
      OAUTH2_PROXY_REDEEM_URL: "http://keycloak:8080/realms/glpi/protocol/openid-connect/token"
      OAUTH2_PROXY_OIDC_JWKS_URL: "http://keycloak:8080/realms/glpi/protocol/openid-connect/certs"
      #OAUTH2_PROXY_PROFILE_URL: "http://keycloak:8080/realms/glpi/protocol/openid-connect/userinfo"
      # QoL
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_COOKIE_SAMESITE: "lax"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SCOPE: "openid profile email"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_UPSTREAMS: "static://200"
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: "/front/helpdesk.public.php,/front/login.php"
      OAUTH2_PROXY_PASS_ID_TOKEN: "false"
    networks: [ glpi_net ]

  nginx:
    image: nginx:1.27
    depends_on: [glpi, oauth2-proxy]
    ports:
      - "80:80"
    volumes:
      - ./nginx/glpi.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [glpi_net]

networks:
  glpi_net:

volumes:
  mysql_data:
  glpi_data:
  keycloak_data: